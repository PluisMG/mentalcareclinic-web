name: verificar

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

env:
  # AP-2026-11-26-10. No es un secreto. PUBLIC_INDEXAR no se define: el build lleva noindex.
  PUBLIC_SITE_URL: https://app.mentalcareclinic.com

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:e2e
      - name: Producción sin PUBLIC_SITE_URL sale con 1
        env:
          VERCEL_ENV: production
          PUBLIC_SITE_URL: ""
        run: |
          set +e
          npm run build
          codigo=$?
          if [ "$codigo" -eq 0 ]; then
            echo "El build de producción sin PUBLIC_SITE_URL no debe pasar"
            exit 1
          fi
      - name: Producción sin PUBLIC_INDEXAR lleva noindex
        env:
          VERCEL_ENV: production
          PUBLIC_SITE_URL: https://app.mentalcareclinic.com
          PUBLIC_INDEXAR: ""
        run: |
          npm run build
          grep -q '<meta name="robots" content="noindex">' dist/index.html
          grep -q 'Disallow: /' dist/robots.txt
